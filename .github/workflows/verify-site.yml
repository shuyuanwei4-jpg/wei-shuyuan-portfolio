name: Verify Published Portfolio
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check page and media
        env:
          SITE_URL: https://shuyuanwei4-jpg.github.io/wei-shuyuan-portfolio
        run: |
          curl --retry 3 --fail --silent --show-error "$SITE_URL/" -o /tmp/portfolio.html
          grep -q 'AI 互动产品与体验设计' /tmp/portfolio.html
          grep -q '媒介是人的延申。' /tmp/portfolio.html
          grep -q 'refinement.js?v=20261112-4' /tmp/portfolio.html
          grep -q 'refinement.css?v=20261112-4' /tmp/portfolio.html
          grep -q 'id="afk-intelligence"' /tmp/portfolio.html
          grep -q 'AIGC Work' /tmp/portfolio.html
          grep -q 'data-filter="aigc"' /tmp/portfolio.html
          grep -q 'id="aigc-carousel"' /tmp/portfolio.html
          grep -q 'id="aigc-carousel" data-autoplay-direction="right"' /tmp/portfolio.html
          curl --retry 3 --fail --silent --show-error "$SITE_URL/refinement.js" -o /tmp/portfolio.js
          grep -Fq 'autoPixelsPerSecond=detailView?120:72' /tmp/portfolio.js
          grep -Fq "'assets/cat-talk-poster-desktop.jpg','landscape',true" /tmp/portfolio.js
          for project in integrity-film nuo-dance tumate; do grep -q "id:'$project'" /tmp/portfolio.js; done
          grep -q '数字非遗·中国好创意省级三等奖' /tmp/portfolio.js
          grep -q 'AI动画短片 · 中国好创意国家三等奖' /tmp/portfolio.js
          grep -q '智能座舱 · HMI 概念设计宣传片' /tmp/portfolio.js
          grep -q "award:'中国好创意省级三等奖'" /tmp/portfolio.js
          grep -q 'has-hover-cover' /tmp/portfolio.js
          grep -Fq 'https://www.tiktok.com/@afkarena.crush' /tmp/portfolio.js
          grep -Fq '核心素材因游戏行业保密协议无法展示' /tmp/portfolio.js
          for cover in afk-hover-desktop.webp afk-hover-mobile.webp; do
            grep -Fq "assets/$cover" /tmp/portfolio.js
            curl --retry 3 --fail --silent --show-error "$SITE_URL/assets/$cover" -o /dev/null
          done
          if grep -q 'hackathon-heading' /tmp/portfolio.html; then exit 1; fi
          grep -q 'kinx-mvp-poster' /tmp/portfolio.html
          grep -q 'carousel-track event-gallery' /tmp/portfolio.html
          grep -q 'cat-talk-hackathon-award.jpg' /tmp/portfolio.html
          grep -q 'film-frame.css?v=20261105-3' /tmp/portfolio.html
          grep -q 'afk-growth.css?v=20261105-3' /tmp/portfolio.html
          for asset in refinement.css refinement.js film-frame.css afk-growth.css assets/afk-intelligence-overview.webp assets/afk-intelligence-background.webp assets/afk-intelligence-workflow.webp assets/afk-intelligence-results.webp assets/afk-crush-tiktok.webp assets/integrity-film.mp4 assets/integrity-film-poster.jpg assets/nuo-dance.mp4 assets/nuo-dance-poster.jpg assets/tumate.mp4 assets/tumate-poster.jpg assets/kinx-cover.webp assets/kinx-rollup-poster.webp assets/cat-talk-poster-desktop.jpg assets/cat-talk-hackathon-award.jpg assets/cat-talk-hackathon-demo.jpg assets/cat-talk-hackathon-venue.jpg assets/wow-balloon-demo.mp4 assets/silent-venting-demo.mp4 assets/kinx-demo.mp4 assets/hellycat-mobile-demo.mp4 assets/cat-talk-demo.mp4 assets/silent-venting-cover.jpg assets/wow-balloon-poster.jpg; do
            status=$(curl --retry 3 --silent --show-error --range 0-1023 --output /dev/null --write-out '%{http_code}' "$SITE_URL/$asset")
            echo "$asset: $status"
            case "$status" in 200|206) ;; *) exit 1 ;; esac
          done
